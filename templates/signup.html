
<h1>Create an Account</h1>

<form action="{{ url_for('signup') }}" method="POST">
    <label for="username">Username</label>
    <input
        type="text"
        id="username"
        name="username"
        required
    >

    <label for="password">Password</label>
    <input
        type="password"
        id="password"
        name="password"
        required
    >

    <div id="volunteer-fields" hidden>
        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            name="name"
        >
        <fieldset>
            <legend>Select your skills</legend>
            {% for skill in skills %}
                <label>
                    <input type="checkbox" name="skills" value="{{ skill }}">
                    {{ skill }}
                </label>
            {% endfor %}
        </fieldset>
    </div>
    <input
        type="checkbox"
        id="volunteer"
        name="volunteer"
        value="yes"
    >
    <label for="volunteer">
        I'm signing up as an volunteer
    </label>
    
    <button type="submit">Sign Up</button>
</form>

<script>
    const volunteerCheckbox = document.getElementById("volunteer");
    const volunteerFields = document.getElementById("volunteer-fields");
    const nameInput = document.getElementById("name");

    function updateVolunteerFields() {
        volunteerFields.hidden = !volunteerCheckbox.checked;
        nameInput.required = volunteerCheckbox.checked;
    }

    volunteerCheckbox.addEventListener("change", updateVolunteerFields);
    updateVolunteerFields();
</script>
