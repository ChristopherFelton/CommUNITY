{% extends "base.html" %}

{% block title %}Sign up · CommUNITY{% endblock %}

{% block content %}
<!-- Sign up page: small logo linking home, then a card with the sign-up form. -->
<!-- TODO switch to url_for once the backend adds these routes (form action and the /login link). -->
<main class="auth-page">
  <a class="logo logo--small" href="/"><span class="logo__comm">Comm</span><span class="logo__unity">UNITY</span></a>

  <!-- A paper note taped to the page, with a little sprout doodle in the corner. -->
  <div class="card card--note card--taped">
    <svg class="doodle card-doodle card-doodle--sprout" aria-hidden="true" focusable="false"><use href="#doodle-sprout"></use></svg>
    <h1 class="card-title">Create your account</h1>

    <!-- The backend handles POST /signup (validation, saving the user, hashing the password).
         Until it does, submitting this form returns "405 Method Not Allowed". -->
    <form id="signup-form" class="form" method="post" action="/signup">
      <!-- First and last name sit side by side on wider screens and stack on phones. -->
      <div class="form-row">
        <div class="field">
          <label for="first_name">First name</label>
          <input type="text" name="first_name" id="first_name" required autocomplete="given-name">
        </div>

        <div class="field">
          <label for="last_name">Last name</label>
          <input type="text" name="last_name" id="last_name" required autocomplete="family-name">
        </div>
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" required autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" required minlength="8"
               autocomplete="new-password" aria-describedby="password-hint">
        <p class="field-hint" id="password-hint">At least 8 characters.</p>
      </div>

      <!-- Radio buttons share name="role", so the backend receives one value: "volunteer" or "organization".
           Neither is preselected, and "required" makes the browser ask the user to pick one. -->
      <fieldset class="field">
        <legend>I am signing up as</legend>

        <div class="choice-option">
          <input type="radio" name="role" value="volunteer" id="role-volunteer" required>
          <label for="role-volunteer">A volunteer looking for opportunities</label>
        </div>

        <div class="choice-option">
          <input type="radio" name="role" value="organization" id="role-organization" required>
          <label for="role-organization">An organization looking for volunteers</label>
        </div>
      </fieldset>

      <button type="submit" class="button button-filled button-block">Sign up</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
  </div>
</main>

<!-- base.html doesn't load main.js yet, so this page loads it itself. -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
