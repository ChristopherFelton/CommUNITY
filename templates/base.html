<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CommUNITY{% endblock %}</title>
  <meta name="description" content="Find community service opportunities near you.">

  <!-- Google Fonts: Nunito for body text, Fraunces (soft serif) for headings,
       Lobster and Kaushan Script for the "CommUNITY" logo.
       If they can't load, style.css falls back to system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..700,0..100&family=Kaushan+Script&family=Lobster&family=Nunito:wght@400;600;700&display=swap">

  <!-- Shared styles for every page. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <!-- Shared doodles (original hand-drawn style SVGs). Hidden here; pages show one with:
       <svg class="doodle ..." aria-hidden="true" focusable="false"><use href="#doodle-heart"></use></svg>
       They use currentColor, so CSS sets each doodle's color. -->
  <svg aria-hidden="true" focusable="false" style="position: absolute; width: 0; height: 0; overflow: hidden;">
    <symbol id="doodle-heart" viewBox="0 0 48 48">
      <path d="M24 39.5c-1.6-1.3-14-9.8-15.6-18.4C7.2 14.6 11 9.6 16.4 9.7c3.6.1 6.2 2.5 7.6 5.5 1.5-3.1 4.2-5.6 7.8-5.5 5.4.2 8.9 5.4 7.6 11.5-1.6 8.3-13.8 16.9-15.4 18.3z"
            fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M15 16.5c1-1.8 2.6-2.6 4.2-2.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <symbol id="doodle-sprout" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 41.5c.3-6.2.4-12.4-.1-19"/>
      <path d="M23.8 27.5c-1-6.6-6.6-11.2-14.2-10.7.1 7.1 5.7 11.6 14.2 10.7z" fill="currentColor" fill-opacity="0.3"/>
      <path d="M24.1 22c.7-7.1 6.5-12.4 14.5-12.1.2 7.7-5.9 12.7-14.5 12.1z" fill="currentColor" fill-opacity="0.3"/>
      <path d="M14.5 42c5.8-1.7 13.2-1.6 19 .1"/>
    </symbol>

    <symbol id="doodle-seed" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 42c5.8-1.7 13.2-1.6 19 .1"/>
      <ellipse cx="24" cy="37" rx="3.6" ry="2.6" fill="currentColor" fill-opacity="0.35"/>
    </symbol>

    <symbol id="doodle-house" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.5 23.8 24 10.3l14.6 13.4"/>
      <path d="M13.6 21.2v18.6h20.9V21"/>
      <path d="M21 39.8v-8c0-1.2.9-2.1 2.1-2.1h1.9c1.2 0 2.1.9 2.1 2.1v8"/>
      <path d="M30.6 15.2V9.6h3.6v8.8"/>
      <circle cx="18.2" cy="26.2" r="1.9" fill="currentColor"/>
    </symbol>

    <symbol id="doodle-sun" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="8.2" fill="currentColor" fill-opacity="0.3"/>
      <path d="M24 5.5v5.2M24.3 37.4v5M5.6 24.2h5M37.5 23.8h5M11 11.1l3.6 3.5M33.5 33.6l3.4 3.6M37.2 10.8l-3.7 3.6M14.5 33.4l-3.6 3.7"/>
    </symbol>

    <symbol id="doodle-sparkle" viewBox="0 0 48 48">
      <path d="M24 6.5c1.2 9.4 5.4 14.1 14.8 15.9-9.4 1.8-13.6 6.6-14.8 16-1.2-9.4-5.5-14.2-14.9-16 9.4-1.8 13.7-6.5 14.9-15.9z"
            fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>
  </svg>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="form-message" role="alert">
      {% for message in messages %}<p>{{ message }}</p>{% endfor %}
    </div>
    {% endif %}
  {% endwith %}

  <!-- Each page fills in this block with its own content. -->
  {% block content %}{% endblock %}
</body>
</html>
